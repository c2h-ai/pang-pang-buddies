<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>팡팡 버디즈 (Pang Pang Buddies)</title>
<style>
  :root { --ink: #0a0e2a; --navy: #121a4a; --cream: #fff3dc; --pink: #ff2e7e; --mag: #ff4fa8; --cyan: #35f2e0; --gold: #ffc94d; }
  html, body { margin: 0; height: 100%; background: #05071a; overflow: hidden; }
  body { font-variant-numeric: tabular-nums; }
  canvas#game { display: block; position: fixed; inset: 0; width: 100%; height: 100%; }
  #ui { position: fixed; inset: 0; pointer-events: none; user-select: none; color: var(--cream); overflow: hidden;
    font: 800 clamp(12px, 1.75vh, 30px)/1.25 "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", system-ui, sans-serif; letter-spacing: -0.01em; }
  #ui .layer { position: absolute; inset: 0; display: none; }
  #ui .layer.on { display: block; }
  .glass { background: linear-gradient(180deg, rgba(24, 33, 92, 0.9), rgba(10, 14, 42, 0.92)); border: 0.14em solid rgba(255, 255, 255, 0.14); border-radius: 1.1em;
    box-shadow: 0 0.5em 1.6em rgba(3, 5, 20, 0.55), inset 0 0.1em 0 rgba(255, 255, 255, 0.16); }
  kbd { display: inline-block; font: inherit; font-size: 0.93em; padding: 0.06em 0.5em; border-radius: 0.45em; background: var(--cream); color: var(--ink); box-shadow: 0 0.16em 0 #b9a98a; margin: 0 0.1em; }
  .star { display: inline-block; width: 1.5em; height: 1.5em; background: rgba(255, 255, 255, 0.16); clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%); }
  .star.on { background: linear-gradient(180deg, #fff1a8, var(--gold)); }

  /* ---- play HUD ---- */
  #song { position: absolute; top: 1.3em; left: 50%; transform: translateX(-50%); display: flex; align-items: center; gap: 0.9em; padding: 0.6em 1.2em 0.6em 0.7em; min-width: 30em; }
  #song .rec { width: 2.9em; height: 2.9em; border-radius: 50%; flex: none; background: radial-gradient(circle, var(--gold) 0 24%, #0a0e2a 25% 34%, #1b2360 35% 44%, #0a0e2a 45% 58%, #1b2360 59% 66%, #0a0e2a 67%); box-shadow: 0 0 0 0.12em rgba(255, 255, 255, 0.2); }
  #song .rec::after { content: ""; display: block; width: 0.26em; height: 1.1em; background: var(--ink); margin: 0.22em auto 0; border-radius: 0.2em; }
  #song .info { flex: 1; min-width: 0; }
  #song .ttl { font-size: 1.05em; white-space: nowrap; }
  #song .ttl b { color: var(--cyan); font-weight: 900; margin-right: 0.5em; }
  #song .track { position: relative; height: 0.56em; margin-top: 0.45em; border-radius: 1em; background: rgba(255, 255, 255, 0.14); }
  #song .fill { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 1em; background: linear-gradient(90deg, var(--cyan), var(--mag)); }
  #song .head { position: absolute; top: 50%; width: 1.1em; height: 1.1em; margin: -0.55em 0 0 -0.55em; border-radius: 50%; background: var(--cream); border: 0.16em solid var(--mag); box-sizing: border-box; box-shadow: 0 0.14em 0 rgba(10, 14, 42, 0.6); }
  #song .time { font-size: 2.1em; font-weight: 900; min-width: 2.6em; text-align: right; }
  #song.low .time { color: var(--pink); animation: beat 0.5s infinite; }
  #round { position: absolute; top: 1.3em; left: 1.4em; padding: 0.55em 1em; }
  #round .lab { font-size: 0.96em; color: var(--cyan); letter-spacing: 0.12em; }
  #round .stars { margin-top: 0.2em; white-space: nowrap; }
  #round .stars .star { width: 1.25em; height: 1.25em; }
  #round .stars i { display: inline-block; width: 0.5em; }
  #keys { position: absolute; top: 1.5em; right: 1.5em; font-size: 1em; padding: 0.5em 0.9em; opacity: 0.92; }
  .cards { position: absolute; bottom: 1.3em; display: flex; gap: 0.8em; }
  #cards-l { left: 1.4em; } #cards-r { right: 1.4em; }
  .card { position: relative; display: flex; align-items: center; gap: 0.7em; padding: 0.55em 0.9em 0.55em 0.55em; width: 14.6em; border-color: color-mix(in srgb, var(--c) 70%, transparent); }
  .card .face { width: 3.9em; height: 3.9em; border-radius: 50%; flex: none; box-shadow: 0 0 0 0.16em var(--c); background: var(--c); }
  .card .meta { flex: 1; min-width: 0; }
  .card .nm { font-size: 1.12em; font-weight: 900; white-space: nowrap; }
  .card .tag { font-size: 0.85em; padding: 0.08em 0.5em; border-radius: 0.5em; background: var(--c); color: var(--ink); vertical-align: 0.14em; margin-left: 0.3em; }
  .card .tag.bot { background: #39428a; color: var(--cream); }
  .card .sk { font-size: 0.95em; white-space: nowrap; margin-top: 0.1em; }
  .card .sk kbd { font-size: 1em; }
  .gauge { position: relative; height: 0.62em; margin-top: 0.38em; border-radius: 1em; background: rgba(255, 255, 255, 0.14); overflow: hidden; }
  .gauge i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 1em; background: linear-gradient(90deg, color-mix(in srgb, var(--c) 70%, #fff), var(--c)); }
  .card.use .gauge i { background: linear-gradient(90deg, #fff, var(--cyan)); }
  .card.tired .gauge { animation: blink 0.25s infinite; background: rgba(255, 46, 126, 0.55); }
  .card .cnt { position: absolute; right: 0.6em; top: 0.45em; font-size: 1.05em; font-weight: 900; display: flex; align-items: center; gap: 0.2em; color: var(--gold); }
  .card .cnt .star { width: 1em; height: 1em; }
  .crown { position: absolute; left: 0.5em; top: -0.95em; width: 1.9em; height: 1.2em; display: none; background: linear-gradient(180deg, #fff1a8, var(--gold)); clip-path: polygon(0 100%, 0 20%, 25% 55%, 50% 0, 75% 55%, 100% 20%, 100% 100%); filter: drop-shadow(0 0.1em 0 var(--ink)); }
  #panel .row { position: relative; }
  #panel .row .crown { display: block; left: 50%; top: -1.1em; margin-left: -0.95em; }
  #panel .row .rank { font-size: 0.9em; color: var(--cyan); }
  #round .stars b { color: var(--gold); font-size: 1.2em; }
  .card .st { position: absolute; right: 0.6em; top: -0.8em; font-size: 0.95em; padding: 0.12em 0.6em; border-radius: 0.6em; background: var(--pink); color: #fff; display: none; }
  .card.hang .st, .card.out .st { display: block; }
  .card.hang { animation: shake 0.3s infinite; border-color: var(--pink); }
  .card.out { filter: saturate(0.25) brightness(0.72); }
  .card.out .st { background: #56597a; }
  #callout { position: absolute; left: 50%; top: 31%; transform: translate(-50%, -50%); text-align: center; white-space: nowrap; font-weight: 900; font-size: 4.6em; letter-spacing: -0.02em;
    -webkit-text-stroke: 0.2em var(--ink); paint-order: stroke fill; text-shadow: 0 0.09em 0 var(--ink); opacity: 0; }
  #callout.count { color: var(--cream); font-size: 5.6em; } #callout.pang { color: var(--mag); }
  #callout.fake { color: var(--cyan); } #callout.warn { color: var(--gold); font-size: 3.4em; } #callout.spot { color: #fff; font-size: 3.4em; }
  #callout.win { color: var(--gold); } #callout.fail { color: var(--pink); } #callout.start { color: var(--cyan); }
  #callout svg { height: 1.9em; display: block; overflow: visible; }
  #bubble { position: absolute; padding: 0.55em 1em; font-size: 1.12em; white-space: nowrap; border-radius: 1.1em 1.1em 1.1em 0.2em; background: var(--cream); color: var(--ink);
    box-shadow: 0 0.3em 0 rgba(10, 14, 42, 0.35); transform-origin: 0 100%; opacity: 0; transition: opacity 0.15s, transform 0.2s cubic-bezier(0.2, 1.6, 0.4, 1); transform: scale(0.6); }
  #bubble.on { opacity: 1; transform: scale(1); }
  #bubble b { display: block; font-size: 0.87em; color: #a8380f; letter-spacing: 0.04em; }
  #hint { position: absolute; left: 50%; bottom: 1.3em; transform: translateX(-50%); padding: 0.5em 1.1em; font-size: 1.04em; max-width: 27em; text-align: center; line-height: 1.32; opacity: 0; transition: opacity 0.3s; border-color: rgba(53, 242, 224, 0.5); }
  #hint.on { opacity: 1; }
  .mark { position: absolute; left: 0; top: 0; will-change: transform; display: none; }
  .mark .pin { position: absolute; left: -0.55em; top: -1.1em; width: 1.1em; height: 1.1em; background: var(--c); clip-path: polygon(0 0, 100% 0, 50% 100%); filter: drop-shadow(0 0.1em 0 var(--ink)); }
  .mark .who { position: absolute; left: 0; top: -2.75em; transform: translateX(-50%); font-size: 0.97em; padding: 0.06em 0.55em; border-radius: 0.6em; background: var(--c); color: var(--ink); white-space: nowrap; box-shadow: 0 0.14em 0 var(--ink); }
  .mark .bar { position: absolute; left: -1.7em; top: 0.25em; width: 3.4em; height: 0.44em; border-radius: 1em; background: rgba(10, 14, 42, 0.8); overflow: hidden; display: none; }
  .mark .bar i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--cyan); }
  .mark.tired .bar i { background: var(--pink); }
  .mark.hang .pin { background: var(--pink); animation: beat 0.4s infinite; }
  .mark .sos { position: absolute; left: -2.2em; top: -6.4em; width: 4.4em; height: 4.4em; display: none; }
  .mark.hang .sos { display: block; }
  .mark .sos svg { width: 100%; height: 100%; transform: rotate(-90deg); }
  .mark .sos .bang { position: absolute; left: 50%; top: 50%; width: 0.5em; height: 1.5em; margin: -1.15em 0 0 -0.25em; border-radius: 0.3em; background: #fff; }
  .mark .sos .bang::after { content: ""; position: absolute; left: 0; top: 1.75em; width: 0.5em; height: 0.5em; border-radius: 50%; background: #fff; }
  .toast { position: absolute; left: 0; top: 0; font-size: 1.25em; font-weight: 900; white-space: nowrap; -webkit-text-stroke: 0.22em var(--ink); paint-order: stroke fill; display: none; }

  /* ---- title and lobby ---- */
  #title .logo { position: absolute; left: 50%; top: 4.5%; transform: translateX(-50%); width: min(74vw, 96vh); text-align: center; }
  #title .logo svg { width: 100%; height: auto; overflow: visible; filter: drop-shadow(0 0.5em 0.9em rgba(3, 5, 20, 0.6)); }
  #title .logo .gl { animation: bob 1.6s ease-in-out infinite; transform-box: fill-box; transform-origin: 50% 100%; }
  #title .sub { margin-top: -0.2em; font-size: 1.35em; letter-spacing: 0.5em; color: var(--cyan); text-shadow: 0 0.12em 0 var(--ink); padding-left: 0.5em; }
  #title .tagline { display: inline-block; margin-top: 0.7em; font-size: 1.25em; padding: 0.4em 1.2em; }
  #title.lobby .logo { width: min(40vw, 52vh); top: 1.5%; }
  #title.lobby .tagline, #title.lobby .sub { display: none; }
  #title.lobby #seats { display: flex; }
  #seats { position: absolute; left: 50%; bottom: 7.4em; transform: translateX(-50%); display: none; gap: 1em; }
  .seat { position: relative; width: 16em; padding: 0.9em 0.9em 0.8em; text-align: center; border-color: color-mix(in srgb, var(--c) 55%, transparent); transition: transform 0.15s; }
  .seat .face { display: inline-block; width: 6.2em; height: 6.2em; border-radius: 50%; box-shadow: 0 0 0 0.2em var(--c); background: var(--c); }
  .seat .nm { font-size: 1.4em; font-weight: 900; margin-top: 0.3em; }
  .seat .nm small { font-size: 0.69em; margin-left: 0.4em; }
  .seat .sk { display: inline-block; margin-top: 0.3em; padding: 0.1em 0.8em; border-radius: 0.7em; background: var(--c); color: var(--ink); font-size: 0.95em; }
  .seat .tip { margin-top: 0.5em; font-size: 0.95em; font-weight: 700; line-height: 1.35; min-height: 2.7em; }
  .seat .who { margin-top: 0.55em; padding: 0.32em 0; border-radius: 0.7em; background: #2b3478; font-size: 0.97em; }
  .seat.mine { transform: translateY(-0.9em); border-color: var(--c); border-width: 0.22em; box-shadow: 0 1em 1.9em rgba(3, 5, 20, 0.62), inset 0 0.1em 0 rgba(255, 255, 255, 0.16); }
  .seat.mine .who { background: var(--c); color: var(--ink); }
  .seat.ready .who { background: var(--cyan); color: var(--ink); }
  #prompt { position: absolute; left: 50%; bottom: 3.6em; transform: translateX(-50%); font-size: 1.3em; white-space: nowrap; text-shadow: 0 0.12em 0 var(--ink); animation: beat 1.1s infinite; }
  #ver { position: absolute; right: 1.2em; bottom: 1.1em; font-size: 0.95em; font-weight: 700; color: var(--cream); opacity: 0.8; text-shadow: 0 0.12em 0 var(--ink); }
  #how { position: absolute; left: 50%; bottom: 1.1em; transform: translateX(-50%); font-size: 0.96em; white-space: nowrap; padding: 0.4em 1.1em; font-weight: 700; }

  /* ---- panels ---- */
  #panel .box { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); padding: 1.6em 2.2em 1.4em; text-align: center; min-width: 30em; }
  #panel.top .box { top: 16%; transform: translate(-50%, 0); }
  #panel.low .box { top: auto; bottom: 5%; transform: translate(-50%, 0); }
  #panel h1 { margin: 0; font-size: 2.7em; font-weight: 900; letter-spacing: -0.02em; -webkit-text-stroke: 0.14em var(--ink); paint-order: stroke fill; }
  #panel h1.good { color: var(--gold); } #panel h1.bad { color: var(--pink); }
  #panel .big .star { width: 3.2em; height: 3.2em; margin: 0.3em 0.15em 0; }
  #panel .line { margin-top: 0.5em; font-size: 1.12em; }
  #panel .rows { display: flex; gap: 0.7em; justify-content: center; margin-top: 0.9em; }
  #panel .row { width: 9.4em; padding: 0.6em 0.4em; border-radius: 0.9em; background: #1d2663; border: 0.12em solid color-mix(in srgb, var(--c) 60%, transparent); }
  #panel .row .face { display: inline-block; width: 3.4em; height: 3.4em; border-radius: 50%; box-shadow: 0 0 0 0.14em var(--c); background: var(--c); }
  #panel .row .nm { font-weight: 900; margin-top: 0.2em; }
  #panel .row .v { font-size: 0.95em; font-weight: 700; }
  #panel .row .v b { color: var(--cyan); font-size: 1.2em; }
  #panel .foot { margin-top: 1.1em; font-size: 1em; }
  #panel table { margin: 0.8em auto 0; border-collapse: collapse; text-align: left; font-size: 1em; font-weight: 700; }
  #panel td { padding: 0.22em 0.7em; }
  #figs .fig { position: absolute; left: 0; top: 0; transform: translate(-50%, 0); text-align: center; white-space: nowrap; padding: 0.35em 0.9em; font-size: 1.1em; }
  #figs .fig small { display: block; font-size: 0.87em; font-weight: 700; }
  #figs h2 { position: absolute; left: 50%; top: 1.2em; transform: translateX(-50%); margin: 0; font-size: 1.5em; padding: 0.4em 1.2em; }
  @keyframes beat { 0%, 100% { transform: translateX(-50%) scale(1); } 50% { transform: translateX(-50%) scale(1.07); } }
  #song.low .time, .mark.hang .pin { animation-name: beat2; }
  @keyframes beat2 { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.18); } }
  @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
  @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-0.12em); } 75% { transform: translateX(0.12em); } }
  @keyframes bob { 0%, 100% { transform: translateY(0) rotate(0deg); } 50% { transform: translateY(-5px) rotate(-1.5deg); } }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="ui"></div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
